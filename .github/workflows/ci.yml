name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.11.21"

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest

  course:
    name: Course quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.11.21"

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint and format
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Bilingual content and notebooks
        run: uv run python tools/check_content.py

      - name: Course map is up to date
        run: uv run python tools/course_map.py --check

      - name: Generated blocks are up to date
        run: uv run python tools/generated_blocks.py --check

      - name: Lesson gate
        run: uv run python tools/lesson_gate.py

      - name: Notebooks run
        run: uv run python tools/run_notebooks.py
